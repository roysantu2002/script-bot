---
- name: Restart VM
  hosts: all
  become: yes  # Run tasks with privilege escalation (e.g., sudo)
  gather_facts: yes  # Gather system facts about the remote hosts

  tasks:
    - name: Restart the virtual machine
      ansible.builtin.command: virsh reboot {{ vm_name }}'
    - name: Restart the virtual machine
      command: virsh reboot {{ vm_name }}'
    - name: Restart the virtual machine
      command: virsh reboot my_vm_name'
    - name: Restart the virtual machine
      ansible.builtin.command: virsh reboot {{ vm_name }}'
    - name: Restart the virtual machine
      ansible.builtin.command: virsh reboot {{ vm_name }}'
    - name: Restart the virtual machine
      command: virsh reboot {{ vm_name }}'
    - name: Restart the virtual machine
      command: virsh reboot {{ vm_name }}'
    - name: Restart the virtual machine
      command: virsh reboot {{ vm_name }}'
    - name: Restart the virtual machine
      community.vmware.vmware_vm_vm_drs_rule:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: no
        name: "{{ vm_name }}"
        state: poweredoff
      register: vm_powered_off
    - name: Restart the virtual machine
      command: virsh reboot my_vm_name'
