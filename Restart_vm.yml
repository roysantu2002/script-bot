---
- name: Restart VM
  hosts: all
  become: yes  # Run tasks with privilege escalation (e.g., sudo)
  gather_facts: yes  # Gather system facts about the remote hosts

  tasks:
    content="- name: Restart the virtual machine\n  ansible.builtin.command: shutdown -r now\n  when: ansible_hostname == 'target_vm_name'"
    content='- name: Restart the virtual machine\n  ansible.builtin.shell: |\n    virsh shutdown {{ vm_name }}\n    while virsh list --state-running | grep -q {{ vm_name }}; do\n      sleep 5\n    done\n    virsh start {{ vm_name }}\n  register: restart_vm_result\n\n- name: Wait for the VM to become reachable\n  ansible.builtin.wait_for:\n    host: "{{ vm_ip }}"\n    port: 22\n    delay: 10\n    timeout: 300\n    state: started'
